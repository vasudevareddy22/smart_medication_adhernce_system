{% if session.get('user_id') %}
<!-- ==========================================================================
     PERMANENT MULTILINGUAL MEDIVOICE ASSISTANT WIDGET & DRAWER
     Available across all authenticated pages (Patient & Caregiver)
     ========================================================================== -->
<button type="button" class="medivoice-trigger-btn" id="medivoiceTriggerBtn" onclick="toggleMediVoice()" title="Open MediVoice Multilingual AI Assistant" aria-label="Open MediVoice AI Assistant">
  <div class="medivoice-pulse-dot"></div>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    <line x1="12" y1="19" x2="12" y2="22"/>
  </svg>
  <div class="medivoice-btn-labels">
    <span class="medivoice-btn-title">MediVoice AI</span>
    <span class="medivoice-btn-sub">Voice &amp; Text Help</span>
  </div>
</button>

<div class="medivoice-drawer" id="medivoiceDrawer" role="dialog" aria-labelledby="medivoiceHeaderTitle">
  <div class="medivoice-header">
    <div class="medivoice-header-left">
      <div class="medivoice-avatar" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </div>
      <div>
        <div class="medivoice-title" id="medivoiceHeaderTitle">MediVoice AI Assistant</div>
        <div class="medivoice-subtitle">
          <span class="medivoice-status-dot" id="medivoiceStatusDot"></span>
          <span id="medivoiceStatusText">Online • Ready</span>
        </div>
      </div>
    </div>
    <div class="medivoice-header-actions">
      <!-- Language Selector -->
      <select id="medivoiceLangSelect" class="medivoice-lang-dropdown" onchange="onMediVoiceLanguageChange(this.value)" title="Select Interaction Language" aria-label="Select Language">
        <option value="en-IN" selected>English (en-IN)</option>
        <option value="hi-IN">हिन्दी / Hindi (hi-IN)</option>
        <option value="te-IN">తెలుగు / Telugu (te-IN)</option>
        <option value="ta-IN">தமிழ் / Tamil (ta-IN)</option>
      </select>

      <!-- Speaker Mute/Unmute Toggle -->
      <button type="button" class="medivoice-icon-btn" id="medivoiceSpeakerToggle" onclick="toggleSpeakerMute()" title="Mute/Unmute voice speech output" aria-label="Mute or Unmute Voice Output">
        <svg id="speakerOnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <svg id="speakerOffIcon" style="display:none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>

      <!-- Clear Chat History -->
      <button type="button" class="medivoice-icon-btn" onclick="clearMediVoiceConversation()" title="Clear conversation" aria-label="Clear Conversation">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>

      <!-- Stop speaking control -->
      <button type="button" class="medivoice-stop-btn" id="medivoiceStopBtn" onclick="stopSpeaking()" title="Stop audio playback" aria-label="Stop Speaking">
        ⏹ Stop
      </button>

      <!-- Minimize / Close -->
      <button type="button" class="medivoice-close-btn" onclick="toggleMediVoice()" title="Minimize Assistant" aria-label="Minimize Assistant">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Messages scroll area -->
  <div class="medivoice-messages" id="medivoiceMessages" aria-live="polite">
    <!-- Rendered dynamically -->
  </div>

  <!-- Dynamic Multilingual Quick Prompts -->
  <div class="medivoice-quick-prompts" id="medivoiceQuickPrompts">
    <!-- Populated dynamically based on selected language and user role -->
  </div>

  <!-- Live speech interim transcript -->
  <div class="medivoice-live-preview" id="medivoiceLivePreview">
    Listening...
  </div>

  <!-- Controls / Input -->
  <div class="medivoice-controls">
    <button type="button" class="medivoice-mic-btn" id="medivoiceMicBtn" onclick="toggleListening()" title="Speak in English, Hindi, Telugu, or Tamil" aria-label="Toggle Microphone Voice Recognition">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </button>

    <input type="text" class="medivoice-text-input" id="medivoiceInput" placeholder="Speak or type a question..." aria-label="Message Input">

    <button type="button" class="medivoice-send-btn" onclick="sendMediVoiceMessage()" title="Send Message" aria-label="Send Message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>
{% endif %}
